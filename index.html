"utils/store.js": function(require,module,exports){
const { scenes, items } = require('./content');
const spelling = require('./spelling');
const config = require('./config');
const KEY = 'mimo-paris-v1';
const DAY = 24 * 60 * 60 * 1000;
function read() {
  try {
    const value = wx.getStorageSync(KEY);
    const state={
      saved: Array.isArray(value && value.saved) ? value.saved : [],
      completed: Array.isArray(value && value.completed) ? value.completed : [],
      spelled: Array.isArray(value && value.spelled) ? value.spelled : [],
      spellingTargets: value && value.spellingTargets && typeof value.spellingTargets==='object' ? value.spellingTargets : {},
      mistakes: value && value.mistakes && typeof value.mistakes === 'object' && !Array.isArray(value.mistakes) ? value.mistakes : {},
      review: value && value.review && typeof value.review === 'object' && !Array.isArray(value.review) ? value.review : {}
    };
    state.spelled=state.spelled.filter(id=>{const item=items.find(record=>record.id===id);return item&&(item.practiceKind!=='phrase'||state.spellingTargets[id]===spelling.normalize(item.target));});
    state.mistakes=Object.fromEntries(Object.entries(state.mistakes).filter(([key,record])=>record&&items.some(item=>spelling.normalize(item.target)===key)));
    items.filter(item=>item.wordUnitReplaced&&state.review[item.id]&&state.review[item.id].target!==spelling.normalize(item.target)).forEach(item=>{state.review[item.id]={level:0,due:Date.now(),target:spelling.normalize(item.target)};});
    return state;
  } catch (error) {
    wx.showToast({title: '无法读取学习记录，请稍后重试', icon: 'none'});
    return null;
  }
}
function update(change) {
  const state = read();
  if (!state) return false;
  change(state);
  try { wx.setStorageSync(KEY, state); return true; }
  catch (error) { wx.showToast({title: '记录未保存，请重试', icon: 'none'}); return false; }
}
function unlocked(id) {return scenes.some(scene => scene.id === id);}
function resolveMistake(state,item,helped){
  const key=spelling.normalize(item.target);const record=state.mistakes[key];if(!record)return;
  const streak=helped?0:(record.streak||0)+1;
  state.mistakes[key]=Object.assign({},record,{streak,needsPractice:streak<2,lastSeen:Date.now()});
}
function recordMistake(id,answer,helpOnly=false){
  const item=items.find(value=>value.id===id);if(!item)return false;
  return update(state=>{
    const key=spelling.normalize(item.target);const previous=state.mistakes[key]||{};
    state.mistakes[key]={target:item.target,zh:item.targetZh,itemId:id,wrongCount:(previous.wrongCount||0)+(helpOnly?0:1),lastAnswer:answer,streak:0,needsPractice:true,lastSeen:Date.now()};
    const related=items.filter(value=>value.sceneId===item.sceneId&&spelling.normalize(value.target)===key);
    related.forEach(value=>{state.review[value.id]={level:0,due:Date.now(),target:spelling.normalize(value.target)};});
  });
}
function succeed(id,helped=false){const item=items.find(value=>value.id===id);if(!item)return false;return update(state=>resolveMistake(state,item,helped));}
function difficult(state){
  if(!state)return [];
  return Object.keys(state.mistakes).filter(key=>state.mistakes[key].needsPractice).sort((a,b)=>(state.mistakes[b].wrongCount||0)-(state.mistakes[a].wrongCount||0)).map(key=>{
    const record=state.mistakes[key];const source=items.find(value=>value.id===record.itemId);
    const item=items.find(value=>value.type==='words'&&spelling.normalize(value.target)===key&&(!source||value.sceneId===source.sceneId))||source;
    return item?Object.assign({},item,{wrongCount:record.wrongCount,streak:record.streak}):null;
  }).filter(Boolean);
}
function markSpelled(id, answer, helped=false) {
  const item = items.find(value => value.id === id && value.type === 'phrases');
  if (!item || !spelling.correct(answer, item.target)) return false;
  return update(state => {if (!state.spelled.includes(id)) state.spelled.push(id);state.spellingTargets[id]=spelling.normalize(item.target);resolveMistake(state,item,helped);});
}
function toggleSaved(id) {
  if (!items.some(item => item.id === id)) return false;
  return update(state => {
    state.saved = state.saved.includes(id) ? state.saved.filter(value => value !== id) : state.saved.concat(id);
  });
}
function learnStep(sceneId, step) {
  if (!scenes.some(scene => scene.id === sceneId && scene.steps[step])) return false;
  return update(state => {
    if (!unlocked(sceneId, state)) return;
    items.filter(item => item.sceneId === sceneId && item.step === step).forEach(item => {
      if (!state.review[item.id]) state.review[item.id] = {level: 0, due: Date.now(),target:spelling.normalize(item.target)};
    });
  });
}
function complete(id) {
  const state = read();
  if (!state || !unlocked(id, state)) return false;
  const records = items.filter(item => item.sceneId === id);
  if (!records.length || !records.every(item => state.review[item.id])) return false;
  if (!records.filter(item => item.type === 'phrases').every(item => state.spelled.includes(item.id))) return false;
  return update(value => { if (!value.completed.includes(id)) value.completed.push(id); });
}
function due(state, now = Date.now()) {
  return state ? items.filter(item => state.review[item.id] && state.review[item.id].due <= now).sort((a,b)=>Number(!!(state.mistakes[spelling.normalize(b.target)]||{}).needsPractice)-Number(!!(state.mistakes[spelling.normalize(a.target)]||{}).needsPractice)) : [];
}
function rate(id, remembered, now = Date.now()) {
  return update(state => {
    const record = state.review[id];
    if (!record) return;
    const level = remembered ? Math.min((record.level || 0) + 1, 3) : 0;
    const item=items.find(value=>value.id===id);
    state.review[id] = {level, due: now + (remembered ? [0, 1, 3, 7][level] * DAY : 10 * 60 * 1000),target:spelling.normalize(item.target)};
  });
}
function shareScene(id) {
  const scene = scenes.find(value => value.id === id) || scenes[0];
  return {title: `${config.name} · ${scene.title}`, path: `/pages/scene/scene?id=${encodeURIComponent(scene.id)}`};
}
function shareHome() {
  return {title: `${config.name} · 一起学日常法语`, path: '/pages/home/home'};
}
module.exports = {read, unlocked, markSpelled, recordMistake, succeed, difficult, toggleSaved, learnStep, complete, due, rate, shareScene, shareHome};

},
"utils/spelling.js": function(require,module,exports){
function normalize(value) {return String(value || '').normalize('NFC').trim().toLocaleLowerCase('fr-FR').replace(/[’‘]/g, "'").replace(/\s+/g,' ').replace(/[.!?…]+$/u,'').trim();}
function correct(answer, target) {return normalize(answer) === normalize(target);}
function plain(value){return normalize(value).normalize('NFD').replace(/[\u0300-\u036f]/g,'');}
function diagnose(answer,target){
 const typed=normalize(answer),expected=normalize(target);
 if(!typed)return '先输入单词，再检查拼写。';
 if(correct(answer,target))return '拼写正确 ✓';
 if(expected.includes(' ')&&typed.split(' ').length<expected.split(' ').length)return `这里要写完整表达，共 ${expected.split(' ').length} 个词，不能只填一个词。`;
 if(plain(typed)===plain(expected)){
  const names={'é':'é（尖音符）','è':'è（重音符）','ê':'ê（长音符）','à':'à（重音符）','ç':'ç（软音符）','ù':'ù（重音符）','î':'î（长音符）','ô':'ô（长音符）','ï':'ï（分音符）'};
  const index=[...expected].findIndex((letter,i)=>letter!==[...typed][i]);
  return `字母基本对了，第 ${index+1} 个位置应是 ${names[[...expected][index]]||[...expected][index]}。`;
 }
 const withoutArticle=typed.replace(/^(?:(?:une|un|les|le|la|des|du|de)\s+|l')/,'');
 if(withoutArticle!==typed&&plain(withoutArticle)===plain(expected))return expected.includes(' ')?'前面多加了一次冠词，按题目填写完整表达。':'这里只填单词，不用加 un、une、le、la 等冠词。';
 if(expected.endsWith('s')&&typed===expected.slice(0,-1))return '这里需要复数，词尾还少一个 s。';
 if(expected.endsWith('x')&&typed===expected.slice(0,-1))return '词尾还少一个 x，注意这个复数或词尾形式。';
 if(typed.replace(/[-' ]/g,'')===expected.replace(/[-' ]/g,''))return '注意连字符 - 和撇号 ’ 的位置，不要用空格代替。';
 let index=0;while(index<typed.length&&index<expected.length&&typed[index]===expected[index])index++;
 if(typed.length===expected.length&&typed[index]===expected[index+1]&&typed[index+1]===expected[index])return `第 ${index+1}、${index+2} 个字母的顺序反了。`;
 if(typed.length<expected.length)return `少了 ${expected.length-typed.length} 个字符，从第 ${index+1} 个位置检查。`;
 if(typed.length>expected.length)return `多了 ${typed.length-expected.length} 个字符，从第 ${index+1} 个位置检查。`;
 return `第 ${index+1} 个字母还不对，试着分组记忆后再拼。`;
}
function compare(answer,target){const typed=[...normalize(answer)],expected=[...normalize(target)];return expected.map((letter,index)=>({letter,typed:typed[index]||'缺',wrong:typed[index]!==letter}));}
module.exports = {normalize, correct, diagnose, compare};

},
"utils/spelling-practice.js": function(require,module,exports){
const spelling=require('./spelling');
const store=require('./store');
const sounds=require('./feedback');
function state(){return {answer:'',feedback:'',attempts:0,rescue:'',usedHelp:false,comparison:[],previousAnswer:'',studyOpen:false};}
const methods={
 input(event){this.cursor=event.detail.cursor;this.setData({answer:event.detail.value,feedback:''});},
 rememberCursor(event){if(Number.isInteger(event.detail.cursor))this.cursor=event.detail.cursor;},
 accent(event){const char=event.currentTarget.dataset.char;const value=this.data.answer;const position=Number.isInteger(this.cursor)?this.cursor:value.length;const previous=value[position-1];const base=letter=>String(letter||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();const replace=/[éèêàçùôîï]/.test(char)&&previous!==char&&base(previous)===base(char);const start=replace?position-1:position;this.cursor=start+char.length;this.setData({answer:value.slice(0,start)+char+value.slice(position),feedback:''});},
 check(){
  const item=this.currentSpellingItem();if(!item||this.data.passed||this.data.checked||this.data.rescue==='observe')return;
  if(!spelling.normalize(this.data.answer)){this.setData({feedback:item.practiceKind==='phrase'?'先输入完整表达，再检查拼写。':'先输入单词，再检查拼写。'});return;}
  if(spelling.correct(this.data.answer,item.target)){
    if(this.data.rescue==='copy'){sounds.play();this.cursor=0;this.setData({rescue:'',answer:'',attempts:0,comparison:[],previousAnswer:'',studyOpen:false,feedback:'现在遮住答案，独立拼一次。'});return;}
    this.spellingPassed(this.data.usedHelp);if(this.data.passed||this.data.checked){if(wx.hideToast)wx.hideToast();sounds.play('correct');}return;
  }
  if(!store.recordMistake(item.id,this.data.answer))return;
  sounds.play('error');
  const attempts=this.data.attempts+1;
  let feedback=spelling.diagnose(this.data.answer,item.target);
  if(attempts===2)feedback+=` 提示：${item.target[0]}…，共 ${[...item.target].length} 个字符。`;
  this.setData({attempts,usedHelp:true,feedback,rescue:attempts>=3?'observe':this.data.rescue,comparison:spelling.compare(this.data.answer,item.target),previousAnswer:this.data.answer});
 },
 seeWord(){const item=this.currentSpellingItem();if(!item)return;if(!store.recordMistake(item.id,this.data.answer,true))return;this.setData({rescue:'observe',usedHelp:true,comparison:spelling.compare(this.data.answer,item.target),previousAnswer:this.data.answer,feedback:'先观察正确写法，再跟写，最后遮住重拼。'});},
 copyWord(){this.cursor=0;this.setData({rescue:'copy',usedHelp:true,answer:'',attempts:0,feedback:'看着上面的词，完整输入一遍。'});},
 toggleStudy(){const opening=!this.data.studyOpen;if(opening&&!this.data.passed&&!this.data.checked&&(this.data.practice||this.data.item)){const item=this.currentSpellingItem();if(!store.recordMistake(item.id,this.data.answer,true))return;this.setData({usedHelp:true});}this.setData({studyOpen:opening});}
};
module.exports={state,methods};

},
"utils/feedback.js": function(require,module,exports){
const KEY='mimo-click-sounds';
const players={};
function enabled(){try{return wx.getStorageSync(KEY)!==false;}catch(error){return true;}}
function play(kind='tap'){
 if(!enabled()||!wx.createInnerAudioContext)return;
 if(!players[kind]){const audio=wx.createInnerAudioContext();audio.src=`/assets/sounds/${kind}.wav`;audio.volume=kind==='tap'?.18:.26;audio.obeyMuteSwitch=true;audio.onError(()=>{});players[kind]=audio;}
 players[kind].stop();players[kind].play();
}
function stop(){Object.keys(players).forEach(key=>players[key].stop());}
const taps=['start','practice','accent','save','saveWord','nextStep','previous','copyWord','seeWord','toggleStudy','reveal','hint','skip','next','restart','goMap','goReview','openScene','filter','remove','zoom','locateCat','togglePlaces','findScene','culture','savePoster','previewPoster','onShareAppMessage'];
function withSounds(options){
 const result=Object.assign({},options);
 taps.forEach(name=>{const method=result[name];if(typeof method==='function')result[name]=function(...args){play();return method.apply(this,args);};});
 const tab=result.onTabItemTap;result.onTabItemTap=function(...args){play();if(tab)return tab.apply(this,args);};
 result.toggleSound=function(){const next=!enabled();try{wx.setStorageSync(KEY,next);}catch(error){wx.showToast({title:'音效设置未保存，请重试',icon:'none'});return;}this.setData({soundEnabled:next});if(next)play();else stop();};
 return result;
}
module.exports={enabled,play,stop,withSounds};

async function codePath(scene) {
  return 'codes/'+scene.id+'.png';
  if(!config.cloudEnv || !wx.cloud)return '';
  const response=await wx.cloud.callFunction({name:'sceneCode',data:{id:scene.id}});
  if(!response.result || !response.result.base64)throw Error('Missing mini program code');
  const file=`${wx.env.USER_DATA_PATH}/mimo-code-${scene.id}.png`;
  await new Promise((resolve,reject)=>wx.getFileSystemManager().writeFile({filePath:file,data:response.result.base64,encoding:'base64',success:resolve,fail:reject}));
  return file;
}
async function generate(page,scene) {
  const canvas=await new Promise((resolve,reject)=>wx.createSelectorQuery().in(page).select('#posterCanvas').fields({node:true,size:true}).exec(result=>result[0]&&result[0].node?resolve(result[0].node):reject(Error('Canvas unavailable'))));
  canvas.width=600;canvas.height=800;let image=null;
  try {const path=await codePath(scene);if(path)image=await new Promise((resolve,reject)=>{const img=canvas.createImage();img.onload=()=>resolve(img);img.onerror=reject;img.src=path;});}
  catch(error){wx.showToast({title:'分享码暂未加载，自拍仍可保存',icon:'none'});}
  draw(canvas.getContext('2d'),scene,image);
  const result=await new Promise((resolve,reject)=>wx.canvasToTempFilePath({canvas,width:600,height:800,destWidth:600,destHeight:800,fileType:'png',success:resolve,fail:reject},page));
  return {path:result.tempFilePath,hasCode:!!image};
}
module.exports={generate,draw};

},
"utils/map.js": function(require,module,exports){
const width=1800,height=1500;
const positions={cafe:[590,760],bakery:[330,590],restaurant:[910,820],market:[1170,620],metro:[820,1100],park:[460,1080],museum:[650,380],zoo:[1420,990],hotel:[910,510],supermarket:[190,820],station:[1180,220],pharmacy:[260,300]};
function clamp(x,y,zoom,ratio){return {x:Math.min(0,Math.max(694*ratio-width*ratio*zoom,x)),y:Math.min(0,Math.max(650*ratio-height*ratio*zoom,y))};}
function center(id,zoom,ratio){const point=positions[id]||positions.cafe;return clamp(347*ratio-(point[0]+83)*ratio*zoom,325*ratio-(point[1]+60)*ratio*zoom,zoom,ratio);}
module.exports={width,height,positions,clamp,center};

},

const feedback=require('../../utils/feedback');

const store=require('../../utils/store');
const poster=require('../../utils/poster');
const practice=require('../../utils/spelling-practice');
Page(feedback.withSounds(Object.assign({},practice.methods,{
  data:Object.assign(practice.state(),{scene:null,step:null,line:null,index:0,phraseIndex:0,round:1,saved:{},started:false,revealed:false,practice:false,passed:false,cultureOpen:false,finished:false,posterPath:'',posterBusy:false,hasCode:false,accents:['é','è','ê','à','ç','ù','ô','î','ï','’']}),
  onLoad(options){
    this.roundPasses=new Set();
    let id=options.id;
    if(options.scene){const query=decodeURIComponent(options.scene);id=query.startsWith('id=')?query.slice(3):query;}
    const scene=scenes.find(value=>value.id===id)||scenes[0];

    this.audio.onError(()=>wx.showToast({title:'发音播放失败，请重试',icon:'none'}));
  },
  onShow(){if(this.data.scene)this.refresh();},
  onHide(){if(this.audio)this.audio.stop();},
  onUnload(){if(this.audio)this.audio.destroy();},
  refresh(){const state=store.read();const saved={};if(state)state.saved.forEach(id=>saved[id]=true);this.setData({saved});},

  start(){this.setData({started:true});this.play({currentTarget:{dataset:{kind:'prompt'}}});},

  reveal(){this.setData({revealed:!this.data.revealed});},

 area.addEventListener('pointermove',event=>{if(!drag||drag.id!==event.pointerId)return;const dx=event.clientX-drag.x,dy=event.clientY-drag.y;if(Math.hypot(dx,dy)>7){drag.moved=true;area.setPointerCapture(event.pointerId);area.style.cursor='grabbing';}if(drag.moved){event.preventDefault();apply(drag.base.x+dx,drag.base.y+dy);}});
 const end=event=>{if(!drag||drag.id!==event.pointerId)return;if(drag.moved)suppressUntil=performance.now()+300;drag=null;area.style.cursor='grab';if(area.hasPointerCapture(event.pointerId))area.releasePointerCapture(event.pointerId);};
 area.addEventListener('pointerup',end);area.addEventListener('pointercancel',end);
 area.addEventListener('click',event=>{if(performance.now()<suppressUntil){event.preventDefault();event.stopImmediatePropagation();}},true);

let suppressSceneTapUntil=0;
function setupSceneSwipe(){
 const root=document.querySelector('.scene-content');if(!root)return;
 const screen=document.getElementById('screen');if(!screen.dataset.swipeGuard){screen.dataset.swipeGuard='1';screen.addEventListener('click',event=>{if(Date.now()<suppressSceneTapUntil){event.preventDefault();event.stopImmediatePropagation();}},true);}
 root.style.touchAction='pan-y';let start=null;
 root.addEventListener('pointerdown',event=>{if(event.button!==0||event.target.closest('input'))return;start={x:event.clientX,y:event.clientY,id:event.pointerId};current.swipeStart({touches:[{clientX:event.clientX,clientY:event.clientY}],target:{dataset:event.target.dataset||{}}});});
 root.addEventListener('pointermove',event=>{if(!start||event.pointerId!==start.id)return;if(Math.abs(event.clientX-start.x)>14&&Math.abs(event.clientX-start.x)>Math.abs(event.clientY-start.y)*1.3)root.setPointerCapture(event.pointerId);});
 root.addEventListener('pointerup',event=>{if(!start||event.pointerId!==start.id)return;const dx=event.clientX-start.x,dy=event.clientY-start.y;if(Math.abs(dx)>=60&&Math.abs(dx)>Math.abs(dy)*1.3)suppressSceneTapUntil=Date.now()+300;if(root.hasPointerCapture(event.pointerId))root.releasePointerCapture(event.pointerId);start=null;current.swipeEnd({changedTouches:[{clientX:event.clientX,clientY:event.clientY}]});});
 root.addEventListener('pointercancel',()=>{start=null;current.swipe=null;});
}

function render(){if(!current)return;const active=document.activeElement;const focused=active&&active.classList.contains('spell-input');const start=focused?active.selectionStart:0;const doc=new DOMParser().parseFromString(templates[route],'text/html');const fragment=document.createDocumentFragment();children(doc.body,fragment,current.data);document.getElementById('screen').replaceChildren(fragment);setupMap();setupSceneSwipe();if(focused){const input=document.querySelector('.spell-input');if(input&&!input.disabled){input.focus();input.setSelectionRange(start,start)}}document.querySelectorAll('.tabs button').forEach(button=>button.classList.toggle('selected',button.dataset.page===route));document.getElementById('back').style.visibility=route==='scene'?'visible':'hidden';}
function navigate(url){if(current&&route==='home')homePage=current;if(current&&current.onUnload)current.onUnload();const match=url.match(/pages\/(\w+)\/\w+/);route=match?match[1]:'home';const params=Object.fromEntries(new URLSearchParams(url.split('?')[1]||''));const file='pages/'+route+'/'+route+'.js';document.getElementById('title').textContent='Mimo在巴黎散步的天';if(route==='home'&&homePage){current=homePage;}else{delete cache[file];load(file);if(current.onLoad)current.onLoad(params);}if(current.onShow)current.onShow();render();document.getElementById('screen').scrollTop=0;}
async function showShare(){const url=new URL(location.href);url.search='';url.hash='';if(route==='scene'&&current.data.scene)url.searchParams.set('scene',current.data.scene.id);const title='Mimo在巴黎散步的天';try{if(navigator.share){await navigator.share({title,text:'和小猫一起在巴黎学法语',url:url.href});}else if(navigator.clipboard&&location.protocol!=='file:'){await navigator.clipboard.writeText(url.href);notify('链接已复制，可以发给朋友');}else{prompt('复制链接，和朋友一起散步',url.href);}}catch(error){if(error.name!=='AbortError')notify('请复制地址栏中的链接分享');}}
document.querySelectorAll('.tabs button').forEach(button=>button.onclick=()=>{load('utils/feedback.js').play();navigate('/pages/'+button.dataset.page+'/'+button.dataset.page)});document.getElementById('back').onclick=()=>navigate('/pages/home/home');document.getElementById('share').onclick=showShare;navigate('/pages/home/home');const entry=new URLSearchParams(location.search).get('scene');if(entry&&load('utils/content.js').scenes.some(s=>s.id===entry))navigate('/pages/scene/scene?id='+entry);
